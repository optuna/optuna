name: Reviewdog

on:
  pull_request:
    types: [opened, review_requested]

permissions:
  contents: read
  pull-requests: write

jobs:
  reviewdog:
    runs-on: ubuntu-latest

    if: github.event.action == 'opened' || github.event.requested_team.name == 'reviewdog'

    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: 3.12
        enable-cache: true

    - name: Install
      run: |
        uv sync --group checking

    - name: Output installed packages
      run: |
        uv pip freeze
    - name: Output dependency tree
      run: |
        uv tree --group checking

    - name: Apply formatters
      run: |
        uv run ruff check . --fix
        uv run ruff format .

    - name: Reviewdog
      uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
      with:
        tool_name: formatters
