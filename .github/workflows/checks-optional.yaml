name: Checks (with optional dependencies)

on:
  schedule:
    - cron: '0 23 * * SUN-THU'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: (github.event_name == 'schedule' && github.repository == 'optuna/optuna') || (github.event_name != 'schedule')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: 3.12
        enable-cache: true

    - name: Install
      run: |
        uv sync --group checking --group test --extra document --extra optional

    - name: Output installed packages
      run: |
        uv pip freeze
    - name: Output dependency tree
      run: |
        uv tree --group checking --group test
  
    - name: ruff
      run: |
        uv run ruff check .
        uv run ruff format . --check --diff
    - name: mypy
      run: uv run mypy . --warn-unused-ignores
